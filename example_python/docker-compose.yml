# Convenience compose file for the Python reference container.
#
#   docker compose -f example_python/docker-compose.yml up --build
#   open http://localhost:9090/
#
# The build context is the repo root (..) so the Dockerfile can COPY the
# shared assets (index.html, JsonMerge.js, example_data/, docs/, img/).
services:
  json-merger-python:
    build:
      context: ..
      dockerfile: example_python/Dockerfile
    image: json-merger-python:latest
    container_name: json-merger-python
    ports:
      - "9090:9090"
    environment:
      HOST: "0.0.0.0"
      PORT: "9090"
    restart: unless-stopped
